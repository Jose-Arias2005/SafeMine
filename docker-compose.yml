# ==============================================================================
# SafeMine AI — Docker Compose para Despliegue en AWS EC2 (Producción)
# ==============================================================================
# Inicia toda la plataforma en un solo comando dentro de tu instancia AWS EC2:
#   docker compose up -d --build
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. API REST + WebSockets + Gemini IA + AWS Rekognition (FastAPI)
  # ----------------------------------------------------------------------------
  safemine-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safemine-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persistencia de datos en la instancia EC2
      # (Si se conecta AWS RDS PostgreSQL o S3, actúan como respaldo local)
      - ./backend/safemine.db:/app/safemine.db
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Portal Web Administrativo (Next.js 15 — Minera & Contratistas)
  # ----------------------------------------------------------------------------
  safemine-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/kiosco}
    container_name: safemine-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/kiosco}
    depends_on:
      safemine-backend:
        condition: service_healthy

